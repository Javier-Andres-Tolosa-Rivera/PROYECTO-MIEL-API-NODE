<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIEL-API | Galería del Evento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="./style-galeria.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-light bg-white border-bottom mb-4">
        <div class="container">

            <div class="logo-container">
                        <img src="./images/Logo Miel-API - pequeño.png" alt="Logo" class="img-fluid">
            </div>

            <a class="navbar-brand fw-bold" href="./index.html">
                <i class="bi bi-arrow-left me-2"></i> VOLVER AL INICIO
            </a>
        </div>
    </nav>

    <main class="container">
        <div class="text-center mb-5">
            <h1 class="display-6 fw-bold">6to. Foro de Abejas Melíferas 2025</h1>
            <p class="text-muted">Imágenes destacadas del evento</p>
        </div>

        <div id="carouselEvento" class="carousel slide carousel-dark shadow-lg rounded" data-bs-ride="carousel">
            
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carouselEvento" data-bs-slide-to="0" class="active"></button>
                <button type="button" data-bs-target="#carouselEvento" data-bs-slide-to="1"></button>
                <button type="button" data-bs-target="#carouselEvento" data-bs-slide-to="2"></button>
                <button type="button" data-bs-target="#carouselEvento" data-bs-slide-to="3"></button>
                <button type="button" data-bs-target="#carouselEvento" data-bs-slide-to="4"></button>
                <button type="button" data-bs-target="#carouselEvento" data-bs-slide-to="5"></button>
                <button type="button" data-bs-target="#carouselEvento" data-bs-slide-to="6"></button>
                <button type="button" data-bs-target="#carouselEvento" data-bs-slide-to="7"></button>
                <button type="button" data-bs-target="#carouselEvento" data-bs-slide-to="8"></button>
                <button type="button" data-bs-target="#carouselEvento" data-bs-slide-to="9"></button>
                </div>

            <div class="carousel-inner">
                <div class="carousel-item active">
                    <div class="img-wrapper">
                        <img src="./images/Foro apicola 1.jpeg" alt="Charla inaugural">
                    </div>
                    <div class="custom-caption mt-3 bg-white text-center">
                    </div>
                </div>

                <div class="carousel-item">
                    <div class="img-wrapper">
                        <img src="./images/Foro apicola 2.jpg" alt="Muestra de colmenas">
                    </div>
                    <div class="custom-caption py-3 bg-white text-center">
                    </div>
                </div>

                <div class="carousel-item">
                    <div class="img-wrapper">
                        <img src="./images/Foro apicola 3.jpg" alt="Muestra de colmenas">
                    </div>
                    <div class="custom-caption py-3 bg-white text-center">
                    </div>
                </div>

                <div class="carousel-item">
                    <div class="img-wrapper">
                        <img src="./images/Foro apicola 4.jpg" alt="Muestra de colmenas">
                    </div>
                    <div class="custom-caption py-3 bg-white text-center">
                    </div>
                </div>

                <div class="carousel-item">
                    <div class="img-wrapper">
                        <img src="./images/Foro apicola 5.webp" alt="Muestra de colmenas">
                    </div>
                    <div class="custom-caption py-3 bg-white text-center">
                    </div>
                </div>

                <div class="carousel-item">
                    <div class="img-wrapper">
                        <img src="./images/Foro apicola 6.jpg" alt="Muestra de colmenas">
                    </div>
                    <div class="custom-caption py-3 bg-white text-center">
                    </div>
                </div>

                <div class="carousel-item">
                    <div class="img-wrapper">
                        <img src="./images/Foro apicola 7.avif" alt="Muestra de colmenas">
                    </div>
                    <div class="custom-caption py-3 bg-white text-center">
                    </div>
                </div>

                <div class="carousel-item">
                    <div class="img-wrapper">
                        <img src="./images/Foro apicola 8.jpg" alt="Muestra de colmenas">
                    </div>
                    <div class="custom-caption py-3 bg-white text-center">
                    </div>
                </div>

                <div class="carousel-item">
                    <div class="img-wrapper">
                        <img src="./images/Foro apicola 9.jpg" alt="Muestra de colmenas">
                    </div>
                    <div class="custom-caption py-3 bg-white text-center">
                    </div>
                </div>

                <div class="carousel-item">
                    <div class="img-wrapper">
                        <img src="./images/Foro apicola 10.webp" alt="Muestra de colmenas">
                    </div>
                    <div class="custom-caption py-3 bg-white text-center">
                    </div>
                </div>

                </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#carouselEvento" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Anterior</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselEvento" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Siguiente</span>
            </button>
        </div>
    </main>

    <footer class="text-center py-5 mt-5 border-top">
        <p class="mb-0 text-muted">&copy; 2026 MIEL-API - Todos los derechos reservados.</p>
    </footer>
