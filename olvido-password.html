<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miel-api | Recuperar Acceso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style-registro.css"> </head>
<body class="bg-light">

    <header class="py-5">
        <div class="container text-center">
            <a href="index.html">
                <img src="./images/Logo Miel-API.png" alt="Miel-api" height="80">
            </a>
        </div>
    </header>

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-5">
                        <h4 class="fw-bold text-center mb-3">¿Olvidaste tu contraseña?</h4>
                        
                        <p class="text-muted text-center small mb-4">
                            Ingresa tu correo electrónico registrado. Te enviaremos un enlace de recuperación para que puedas restaurar tu acceso de forma segura.
                        </p>

                        <form>
                            <div class="mb-4">
                                <label class="form-label small fw-bold text-uppercase">Correo Electrónico</label>
                                <input type="email" class="form-control" placeholder="tu-correo@ejemplo.com" required>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-dark py-2 fw-bold">ENVIAR ENLACE</button>
                            </div>
                        </form>

                        <div class="text-center mt-4">
                            <a href="registro.html" class="text-decoration-none small text-dark fw-bold">
                                <i class="bi bi-arrow-left"></i> Volver al inicio de sesión
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
