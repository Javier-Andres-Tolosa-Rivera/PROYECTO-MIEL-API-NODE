<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miel-api | Acceso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style-registro.css">
</head>
<body class="bg-light">

<header class="bg-white py-4 border-bottom mb-4">
    <div class="container text-center">
        <a href="index.html">
            <img src="./images/Logo Miel-API.png" alt="Miel-api" height="50" class="mb-2">
        </a>
        
        <div class="mt-1">
            <a href="index.html" class="back-link">Volver a la pagina de inicio</a>
        </div>
    </div>
</header>

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white border-0 pt-4">
                        <ul class="nav nav-pills nav-justified" id="pills-tab" role="tablist">
                            <li class="nav-item">
                                <button class="nav-link active fw-bold" id="tab-login" data-bs-toggle="pill" data-bs-target="#login-content">INICIAR SESIÓN</button>
                            </li>
                            <li class="nav-item">
                                <button class="nav-link fw-bold" id="tab-register" data-bs-toggle="pill" data-bs-target="#register-content">REGISTRAR</button>
                            </li>
                        </ul>
                    </div>

                    <div class="card-body p-4">
                        <div class="tab-content">
                            
                            <div class="tab-pane fade show active" id="login-content">
                                <h5 class="text-center mb-4 text-muted">Bienvenido de nuevo</h5>
                                <form id="form-login">
                                   <div class="mb-3">
                                       <label class="form-label small fw-bold">CORREO ELECTRÓNICO</label>
                                       <input type="email" id="login-correo" class="form-control" placeholder="ejemplo@correo.com" required>
                                   </div>
                                   <div class="mb-3">
                                       <label class="form-label small fw-bold">CONTRASEÑA</label>
                                       <input type="password" id="login-contrasena" class="form-control" placeholder="••••••••" required>
                                   </div>
                                   <div class="d-grid gap-2 mt-4">
                                       <button type="submit" class="btn btn-dark py-2">INGRESAR</button>
                                   </div>
                                   <p class="text-center mt-3 small">
                                       <a href="olvido-password.html" class="text-decoration-none text-muted">¿Olvidaste tu contraseña?</a>
                                   </p>
                               </form>                               
                            </div>

                            <div class="tab-pane fade" id="register-content">
                                <h5 class="text-center mb-4 text-muted">Crea tu cuenta</h5>
                                <form id="form-register">
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold">NOMBRES</label>
                                        <input type="text" id="reg-nombres" class="form-control" placeholder="Tu nombre" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold">APELLIDOS</label>
                                        <input type="text" id="reg-apellidos" class="form-control" placeholder="Tu apellido" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold">CORREO ELECTRÓNICO</label>
                                        <input type="email" id="reg-correo" class="form-control" placeholder="correo@ejemplo.com" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold">CONTRASEÑA</label>
                                        <input type="password" id="reg-contrasena" class="form-control" placeholder="Mínimo 8 caracteres" required>
                                    </div>
                                    <div class="form-check mb-4">
                                        <input class="form-check-input" type="checkbox" id="terms" required>
                                        <label class="form-check-label small text-muted" for="terms">
                                            Acepto los términos y condiciones.
                                        </label>
                                    </div>
                                    <div class="d-grid gap-2">
                                        <button type="submit" class="btn btn-dark py-2">CREAR CUENTA</button>
                                    </div>
                                </form>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
    // --- LÓGICA DE INICIO DE SESIÓN ---
    document.getElementById('form-login').onsubmit = async (e) => {
        e.preventDefault();
        
        const datos = {
            correo: document.getElementById('login-correo').value.trim(),
            contrasena: document.getElementById('login-contrasena').value
        };

        try {
            const res = await fetch('https://localhost:3000/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });

            const resultado = await res.json();

            if (res.ok) {
                alert(`🎉 ${resultado.mensaje} Bienvenido/a ${resultado.usuario.nombres}`);
                
                // Guardamos momentáneamente los datos del usuario logueado en la sesión
                localStorage.setItem('usuarioMielAPI', JSON.stringify(resultado.usuario));
                
                // Redirección condicional según el Rol
                // Roles: 1 = Super Administrador, 2 = Administrador, 5 = Contabilidad
                if ([1, 2, 5].includes(resultado.usuario.id_rol)) {
                    window.location.href = './admin.html'; // Panel Interno
                } else {
                    window.location.href = './productos.html'; // Catálogo de clientes
                }
            } else {
                alert(`❌ Error: ${resultado.error}`);
            }
        } catch (err) {
            alert("❌ Error de conexión con el servidor");
        }
    };

    // --- LÓGICA DE REGISTRO DE USUARIOS ---
    document.getElementById('form-register').onsubmit = async (e) => {
        e.preventDefault();

        const datos = {
            nombres: document.getElementById('reg-nombres').value.trim(),
            apellidos: document.getElementById('reg-apellidos').value.trim(),
            correo: document.getElementById('reg-correo').value.trim(),
            contrasena: document.getElementById('reg-contrasena').value
        };

        try {
            const res = await fetch('https://localhost:3000/api/registro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });

            const resultado = await res.json();

            if (res.ok) {
                alert("✅ " + resultado.mensaje);
                location.reload(); // Recarga para limpiar campos y permitir iniciar sesión
            } else {
                alert(`❌ Error: ${resultado.error}`);
            }
        } catch (err) {
            alert("❌ Error de red al intentar registrar");
        }
    };
</script>

</body>
</html>
