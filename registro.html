<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miel-api | Acceso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style-registro.css">
</head>
<body class="bg-light">

<header class="bg-white py-4 border-bottom mb-4">
    <div class="container text-center">
        <a href="index.html">
            <img src="./images/Logo Miel-API.png" alt="Miel-api" height="50" class="mb-2">
        </a>
        
        <div class="mt-1">
            <a href="index.html" class="back-link">Volver a la pagina de inicio</a>
        </div>
    </div>
</header>

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white border-0 pt-4">
                        <ul class="nav nav-pills nav-justified" id="pills-tab" role="tablist">
                            <li class="nav-item">
                                <button class="nav-link active fw-bold" id="tab-login" data-bs-toggle="pill" data-bs-target="#login-content">INICIAR SESIÓN</button>
                            </li>
                            <li class="nav-item">
                                <button class="nav-link fw-bold" id="tab-register" data-bs-toggle="pill" data-bs-target="#register-content">REGISTRAR</button>
                            </li>
                        </ul>
                    </div>

                    <div class="card-body p-4">
                        <div class="tab-content">
                            
                            <div class="tab-pane fade show active" id="login-content">
                                <h5 class="text-center mb-4 text-muted">Bienvenido de nuevo</h5>
                                <form>
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold">CORREO ELECTRÓNICO</label>
                                        <input type="email" class="form-control" placeholder="ejemplo@correo.com">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold">CONTRASEÑA</label>
                                        <input type="password" class="form-control" placeholder="••••••••">
                                    </div>
                                    <div class="d-grid gap-2 mt-4">
                                        <button type="submit" class="btn btn-dark py-2">INGRESAR</button>
                                    </div>
                                    <p class="text-center mt-3 small">
                                        <a href="olvido-password.html" class="text-decoration-none text-muted">¿Olvidaste tu contraseña?</a>
                                    </p>
                                </form>
                            </div>

                            <div class="tab-pane fade" id="register-content">
                                <h5 class="text-center mb-4 text-muted">Crea tu cuenta</h5>
                                <form>
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold">NOMBRE COMPLETO</label>
                                        <input type="text" class="form-control" placeholder="Tu nombre">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold">CORREO ELECTRÓNICO</label>
                                        <input type="email" class="form-control" placeholder="correo@ejemplo.com">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold">CONTRASEÑA</label>
                                        <input type="password" class="form-control" placeholder="Mínimo 8 caracteres">
                                    </div>
                                    <div class="form-check mb-4">
                                        <input class="form-check-input" type="checkbox" id="terms">
                                        <label class="form-check-label small text-muted" for="terms">
                                            Acepto los términos y condiciones.
                                        </label>
                                    </div>
                                    <div class="d-grid gap-2">
                                        <button type="submit" class="btn btn-dark py-2">CREAR CUENTA</button>
                                    </div>
                                </form>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
