<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miel-api | Carrito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style-carrito.css">

    <style>
    /* Estilo para el contenedor del producto cuando está en 0 */
    .product-item {
        transition: all 0.4s ease; /* Para que el cambio de color sea suave */
    }

    /* Clase que aplicaremos cuando la cantidad sea 0 */
    .item-desactivado img {
        filter: grayscale(100%);
        opacity: 0.5;
    }

    /* El botón de pagar se verá deshabilitado si no hay productos */
    .btn-disabled {
        pointer-events: none;
        opacity: 0.5;
        filter: grayscale(1);
    }
</style>
</style>
</head>
<body class="bg-light">

    <header class="bg-white py-3 border-bottom">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="logo">
                <img src="./images/Logo Miel-API - pequeño.png" alt="Miel-api" height="50">
            </div>
            <div class="search-bar w-50">
                <input type="text" class="form-control rounded-pill" placeholder="BUSCAR">
            </div>
            <div class="d-flex align-items-center">
                <a href="./index.html" class="text-dark text-decoration-none me-3"><strong>INICIO</strong></a>
                <a href="./registro.html" class="text-dark text-decoration-none me-3"><strong>LOGIN/REGISTRAR</strong></a>
                <a href="./productos.html" class="text-dark text-decoration-none me-3"><strong>CATALOGO PRODUCTOS</strong></a>
            </div>
        </div>
    </header>

    <nav class="container mt-4">
        <ul class="nav nav-tabs nav-justified border-0">
            <li class="nav-item">
                <a class="nav-link active fw-bold text-dark border-0 border-bottom border-dark border-3">DETALLES DE LA COMPRA</a>
            </li>
        </ul>
    </nav>

    <main class="container my-5">
        <div class="row g-5">
            <div class="col-md-8">
                <h4 class="fw-bold mb-4">CARRITO</h4>
                

                <div id="contenedor-carrito-dinamico" class="container py-4">
                    <!-- Aquí JavaScript insertará los productos automáticamente -->
                </div>

                <!-- En la parte inferior de tu carrito.html -->
        <div class="row mt-4 pt-3 border-top">
          <div class="col-12 d-flex flex-wrap gap-2 justify-content-between">
        <div>
            <a href="productos.html" class="btn btn-outline-dark text-uppercase fw-bold">
                <i class="bi bi-arrow-left me-2"></i>Seguir Comprando
            </a>
        </div>


        <div class="d-flex gap-2">
            <button onclick="vaciarCarrito()" class="btn btn-danger text-uppercase fw-bold">Vaciar Carrito</button>
            <a href="productos.html" class="btn btn-secondary text-uppercase fw-bold">Cancelar</a>
            <button onclick="procesarPago()" class="btn btn-dark text-uppercase fw-bold px-4">Pagar</button>
        </div>
        </div>
        </div>

            </div>

            <div class="col-md-4">
    <h4 class="fw-bold mb-4 text-uppercase">Resumen de Compra</h4>
    <div class="resumen-container p-3 bg-white border rounded">

        <!-- Le ponemos el ID 'detalle-resumen' que es el que usa tu función renderizarCarrito -->
        <div id="detalle-resumen" class="resumen-container">
            <p class="text-muted small">No hay productos seleccionados</p>
            <hr>
        <div class="d-flex justify-content-between align-items-center mt-3">
        <h4 class="fw-bold text-muted">TOTAL</h4>
        <h4 class="fw-bold">$0</h4>
        </div>
            </div>

        </div>
        </div>

        </div>
    </main>

    <script>
    // Tu función renderizarCarrito está bien, solo asegúrate de llamarla al cargar
    document.addEventListener('DOMContentLoaded', () => {
        renderizarCarrito();
    });

    function renderizarCarrito() {
        const contenedor = document.getElementById('contenedor-carrito-dinamico');
        const resumenDiv = document.getElementById('detalle-resumen'); // ID CORREGIDO
        const carrito = JSON.parse(localStorage.getItem('carritoMielAPI')) || [];
        
        if (carrito.length === 0) {
            contenedor.innerHTML = `
                <div class="text-center py-5">
                    <h3 class="mt-3 text-uppercase fw-bold">Tu carrito está vacío</h3>
                    <a href="productos.html" class="btn btn-dark btn-lg mt-3 rounded-pill">IR AL CATÁLOGO</a>
                </div>`;
            if(resumenDiv) resumenDiv.innerHTML = "<p class='text-muted'>No hay productos</p><hr><h4>TOTAL: $0</h4>";
            actualizarContadorCarrito();
            return;
        }

        let htmlFull = "";
        let granTotal = 0;

        carrito.forEach((item, index) => {
            const subtotal = item.precio * item.cantidad_seleccionada;
            granTotal += subtotal;
            htmlFull += `
                <div class="row align-items-center border-bottom py-3">
                    <div class="col-3 col-md-2 text-center">
                        <img src="img/${item.id_producto}.png" class="img-carrito" onerror="this.src='img/${item.id_producto}.jpg'">
                    </div>
                    <div class="col-9 col-md-4">
                        <h6 class="fw-bold mb-0 text-uppercase">${item.nombre}</h6>
                        <small class="text-muted">${item.peso || 'Unidad'}</small>
                        <p class="mb-0 text-primary fw-bold">$ ${item.precio.toLocaleString('es-CO')}</p>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="input-group input-group-sm" style="max-width: 120px;">
                            <button class="btn btn-outline-dark" onclick="cambiarCantidad(${index}, -1)">-</button>
                            <input type="text" class="form-control text-center" value="${item.cantidad_seleccionada}" readonly>
                            <button class="btn btn-outline-dark" onclick="cambiarCantidad(${index}, 1)">+</button>
                        </div>
                    </div>
                    <div class="col-4 col-md-2 text-end">
                        <span class="fw-bold">$ ${subtotal.toLocaleString('es-CO')}</span>
                    </div>
                    <div class="col-2 col-md-1 text-end">
                        <button class="btn btn-sm text-danger" onclick="eliminarDelCarrito(${index})">Eliminar</button>
                    </div>
                </div>`;
        });

        contenedor.innerHTML = htmlFull;

        // Actualizar el Resumen a la derecha
        if(resumenDiv) {
            resumenDiv.innerHTML = `
                <div class="d-flex justify-content-between mb-2">
                    <span>Productos (${carrito.length}):</span>
                    <span>$ ${granTotal.toLocaleString('es-CO')}</span>
                </div>
                <div class="d-flex justify-content-between mb-3">
                    <span>Envío:</span>
                    <span class="text-success">Gratis</span>
                </div>
                <hr>
                <div class="d-flex justify-content-between">
                    <h4 class="fw-bold">TOTAL</h4>
                    <h4 class="fw-bold text-primary">$ ${granTotal.toLocaleString('es-CO')}</h4>
                </div>
            `;
        }
        actualizarContadorCarrito();
    }

    // --- FUNCIONES DE LÓGICA QUE FALTABAN ---

    function cambiarCantidad(index, cambio) {
        let carrito = JSON.parse(localStorage.getItem('carritoMielAPI')) || [];
        let nuevaCantidad = carrito[index].cantidad_seleccionada + cambio;

        if (nuevaCantidad > 0) { // No permitir menos de 1
            carrito[index].cantidad_seleccionada = nuevaCantidad;
            localStorage.setItem('carritoMielAPI', JSON.stringify(carrito));
            renderizarCarrito();
        }
    }

    function eliminarDelCarrito(index) {
        let carrito = JSON.parse(localStorage.getItem('carritoMielAPI')) || [];
        carrito.splice(index, 1);
        localStorage.setItem('carritoMielAPI', JSON.stringify(carrito));
        renderizarCarrito();
    }

    function vaciarCarrito() {
        if (confirm("¿Deseas vaciar todo el carrito?")) {
            localStorage.removeItem('carritoMielAPI');
            renderizarCarrito();
        }
    }

    function actualizarContadorCarrito() {
        const carrito = JSON.parse(localStorage.getItem('carritoMielAPI')) || [];
        const totalItems = carrito.reduce((sum, item) => sum + item.cantidad_seleccionada, 0);
        // Aquí podrías actualizar un badge en el header si lo tienes
    }

    function procesarPago() {
    // 1. Obtenemos el carrito actual
    const carrito = JSON.parse(localStorage.getItem('carritoMielAPI')) || [];

    // 2. Verificamos si hay productos
    if (carrito.length === 0) {
        alert("Tu carrito está vacío. Agrega productos antes de proceder al pago.");
        return; // Detenemos la ejecución aquí
    }

    // 3. Si hay productos, redirigimos a pagos.html
    // Nota: El carrito sigue guardado en localStorage, así que pagos.html 
    // podrá leerlo para mostrar el total final allí también.
    window.location.href = "pagos.html";
}
</script>

</body>
</html>
