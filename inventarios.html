<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miel-api | Control de Inventarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .sidebar { background: #f8f9fa; min-height: 100vh; border-right: 1px solid #dee2e6; }
        .table-container { background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-agregar { background-color: #ffcc00; color: black; font-weight: bold; border: none; }
        .btn-agregar:hover { background-color: #e6b800; }
        .stock-badge { padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body class="bg-light">

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-2 d-none d-md-block sidebar p-4">
            <h5 class="fw-bold text-uppercase mb-4">Miel-api Admin</h5>
            <ul class="nav flex-column">
                <li class="nav-item mb-2"><a href="./admin.html" class="nav-link link-secondary">Gestión Usuarios</a></li>
                <li class="nav-item mb-2"><a href="./inventarios.html" class="nav-link active link-dark fw-bold">Inventarios</a></li>
                <hr>
                <li class="nav-item mb-2"><a href="./productos.html" class="nav-link link-secondary">Ver Tienda</a></li>
                <li class="nav-item mb-2"><a href="./index.html" class="nav-link link-danger mt-4">Cerrar Sesión</a></li>
            </ul>
        </nav>

<!-- ... (Mismos estilos anteriores) ... -->

        <main class="col-md-10 p-5">
            <!-- Título y Buscador idénticos -->
            <div class="row align-items-center mb-4">
                <div class="col-md-5"><h2 class="fw-bold m-0">Control de Inventarios (Stock)</h2></div>
                <div class="col-md-4">
                    <input type="text" id="buscador" class="form-control" placeholder="Buscar producto..." onkeyup="filtrarProductos()">
                </div>
                <div class="col-md-3 text-end">
                    <button class="btn btn-agregar px-4" onclick="prepararNuevoProducto()">+ AGREGAR PRODUCTO</button>
                </div>
            </div>

            <div class="table-container p-4">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>#</th> <!-- Número correlativo -->
                            <th>Producto</th>
                            <th>Tipo</th> <!-- REINTEGRADO -->
                            <th>Presentación</th>
                            <th>Precio (Unidad)</th>
                            <th>Stock</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-inventario"></tbody>
                </table>
            </div>
        </main>

<!-- Modal Actualizado -->
<div class="modal fade" id="modalProducto" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-dark text-white"><h5 class="modal-title">Gestión de Producto</h5></div>
            <form id="formInventario">
                <div class="modal-body">
                    <input type="hidden" id="prod-id">
                    <div class="mb-3">
                        <label class="form-label">Nombre del Producto</label>
                        <input type="text" id="prod-nombre" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tipo (Ej: Miel de Abejas, Cosmética, Polen)</label>
                        <input type="text" id="prod-tipo" class="form-control" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Presentación</label>
                            <input type="text" id="prod-peso" class="form-control" placeholder="500g" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Precio ($)</label>
                            <input type="number" id="prod-precio" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Stock Actual</label>
                        <input type="number" id="prod-stock" class="form-control" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-dark w-100">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    let todosLosProductos = [];
    let editando = false;

    // 1. CARGAR DATOS DE LA API
    async function cargarInventario() {
        try {
            const res = await fetch('http://localhost:3000/api/productos');
            if (!res.ok) throw new Error('Error en la red');
            todosLosProductos = await res.json();
            renderizarTabla(todosLosProductos);
        } catch (err) {
            console.error("Error al cargar:", err);
            document.getElementById('tabla-inventario').innerHTML = `<tr><td colspan="7" class="text-center text-danger">Error al conectar con el servidor</td></tr>`;
        }
    }

    // 2. DIBUJAR LA TABLA
    function renderizarTabla(lista) {
        const tabla = document.getElementById('tabla-inventario');
        tabla.innerHTML = "";
        
        lista.forEach((p, index) => {
            const claseStock = p.cantidad_unidad <= 15 ? 'text-danger fw-bold' : 'text-success fw-bold';
            
            tabla.innerHTML += `
                <tr>
                    <td class="text-muted">${index + 1}</td>
                    <td class="fw-bold">${p.nombre_producto}</td>
                    <td><span class="badge bg-secondary text-white">${p.tipo || 'Sin tipo'}</span></td>
                    <td>${p.peso_producto}</td>
                    <td>$ ${parseFloat(p.precio_unidad).toLocaleString()}</td>
                    <td class="${claseStock}">${p.cantidad_unidad} unidades</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="abrirEditor(${p.id_producto})">
                            <i class="bi bi-pencil"></i> Editar
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="eliminarProducto(${p.id_producto})">
                            <i class="bi bi-trash"></i> Eliminar
                        </button>
                    </td>
                </tr>`;
        });
    }

    // 3. PREPARAR MODAL PARA NUEVO
    function prepararNuevoProducto() {
        editando = false;
        document.getElementById('prod-id').value = "";
        document.getElementById('formInventario').reset();
        new bootstrap.Modal(document.getElementById('modalProducto')).show();
    }

    // 4. ABRIR EDITOR CON DATOS CARGADOS
    function abrirEditor(id) {
        editando = true;
        const p = todosLosProductos.find(item => item.id_producto === id);
        if(p) {
            document.getElementById('prod-id').value = p.id_producto;
            document.getElementById('prod-nombre').value = p.nombre_producto;
            document.getElementById('prod-tipo').value = p.tipo || '';
            document.getElementById('prod-peso').value = p.peso_producto;
            document.getElementById('prod-precio').value = p.precio_unidad;
            document.getElementById('prod-stock').value = p.cantidad_unidad;
            new bootstrap.Modal(document.getElementById('modalProducto')).show();
        }
    }

    // 5. GUARDAR (CREAR O EDITAR)
    document.getElementById('formInventario').onsubmit = async (e) => {
        e.preventDefault();
        const id = document.getElementById('prod-id').value;
        const datos = {
            nombre_producto: document.getElementById('prod-nombre').value,
            tipo: document.getElementById('prod-tipo').value,
            peso_producto: document.getElementById('prod-peso').value,
            precio_unidad: parseFloat(document.getElementById('prod-precio').value),
            cantidad_unidad: parseInt(document.getElementById('prod-stock').value)
        };

        const url = editando ? `http://localhost:3000/api/productos/${id}` : 'http://localhost:3000/api/productos';
        const metodo = editando ? 'PUT' : 'POST';

        try {
            const res = await fetch(url, {
                method: metodo,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });
            if(res.ok) {
                // Forzamos el cierre del modal de forma manual si getInstance falla
            const modalElement = document.getElementById('modalProducto');
                bootstrap.Modal.getOrCreateInstance(modalElement).hide();
            await cargarInventario(); // Esperamos a que recargue la tabla
            }
        } catch (err) { alert("Error al guardar"); }
    };



    

    // 6. ELIMINAR
    async function eliminarProducto(id) {
        if(confirm("¿Estás seguro de eliminar este producto?")) {
            await fetch(`http://localhost:3000/api/productos/${id}`, { method: 'DELETE' });
            cargarInventario();
        }
    }

    // 7. BUSCADOR
    function filtrarProductos() {
        const texto = document.getElementById('buscador').value.toLowerCase();
        const filtrados = todosLosProductos.filter(p => 
            p.nombre_producto.toLowerCase().includes(texto) || 
            p.tipo.toLowerCase().includes(texto)
        );
        renderizarTabla(filtrados);
    }

    // EJECUTAR AL CARGAR PÁGINA
    window.onload = cargarInventario;

</script>

<!-- Script de Bootstrap (El motor para los modales) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
