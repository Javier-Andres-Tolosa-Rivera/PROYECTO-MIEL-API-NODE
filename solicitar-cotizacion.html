<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miel-api | Solicitar Cotización</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style-registro.css"> </head>
<body class="bg-light">

    <header class="py-5">
        <div class="container text-center">
            <a href="index.html">
                <img src="./images/Logo Miel-API.png" alt="Miel-api" height="80" class="mb-2">
            </a>
            <div class="mt-1">
                <a href="servicios.html" class="back-link">Volver a Servicios</a>
            </div>
        </div>
    </header>

    <main class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-5">
                        <h3 class="fw-bold text-center mb-2">Solicitar Cotización</h3>
                        <p class="text-muted text-center small mb-4">Déjanos tus datos y cuéntanos qué necesitas. Nos pondremos en contacto contigo lo antes posible.</p>
                        
                        <form>
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-uppercase">Nombre Completo</label>
                                <input type="text" class="form-control" placeholder="Ej: Juan Pérez" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-bold text-uppercase">Número celular de contacto</label>
                                <input type="tel" class="form-control" placeholder="Ej: 300 123 4567" required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label small fw-bold text-uppercase">¿Qué deseas saber?</label>
                                <textarea class="form-control" rows="4" placeholder="Escribe aquí los detalles de tu consulta sobre nuestros servicios de polinización o apiarios..."></textarea>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-dark py-3 fw-bold">ENVIAR COTIZACIÓN</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center py-4">
        <p class="text-muted small">© 2026 Miel-api - Servicios Especializados</p>
    </footer>

</body>
</html>
